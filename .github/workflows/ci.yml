name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace apps/web
      - name: Typecheck
        run: npm run typecheck --workspace apps/web
      - name: Test
        run: npm test --workspace apps/web

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace apps/api
      - name: Typecheck
        run: npm run typecheck --workspace apps/api
      - name: Test
        run: npm test --workspace apps/api

  agent:
    name: Agent checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r services/agent/requirements.txt ruff pytest
      - name: Ruff
        run: ruff check services/agent
      - name: Test
        run: pytest services/agent/tests
